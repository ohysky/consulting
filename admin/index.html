<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>구원교 컨설팅 관리자</title><style>:root{--n:#081b38;--b:#1976e8;--bg:#f4f7fb;--line:#dbe3ee;--ink:#10213b;--muted:#66758b;--ok:#0a805b;--danger:#b72d2d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#06172f,#123f78);padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:22px;padding:28px}.loginbox input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px}.loginbox button,.primary{border:0;background:var(--n);color:#fff;border-radius:11px;padding:12px 15px;font-weight:900;cursor:pointer}.loginbox button{width:100%;margin-top:10px}.top{background:var(--n);color:#fff;position:sticky;top:0;z-index:20}.wrap{max-width:1240px;margin:auto;padding:0 18px}.topin{height:66px;display:flex;align-items:center;justify-content:space-between}.topin button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.main{padding:25px 0 50px}.tabs{display:flex;gap:8px;margin-bottom:16px;overflow:auto}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-weight:850;cursor:pointer;white-space:nowrap}.tab.on{background:var(--n);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:26px}.toolbar{display:grid;grid-template-columns:1.6fr .8fr .8fr auto;gap:9px;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #cfd9e6;border-radius:10px;padding:11px;background:#fff}.toolbar button{border:0;background:#e9eef5;border-radius:10px;padding:10px 13px;font-weight:850}.panel{display:none}.panel.on{display:block}.box{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:12px 13px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px}th{background:#f8fafc;color:#526176;font-size:12px}tbody tr{cursor:pointer}tbody tr:hover{background:#f8fbff}.badge{display:inline-block;background:#eef3f9;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850}.gold{background:#fff3d7;color:#805b09}.green{background:#e9f8f2;color:#087555}.red{background:#fdeeee;color:#9d2222}.slot-create{display:grid;grid-template-columns:.7fr 1fr .8fr .8fr .7fr 1.5fr auto;gap:9px;padding:15px;border-bottom:1px solid var(--line)}.slot-create input,.slot-create select{min-width:0;border:1px solid #cfd9e6;border-radius:10px;padding:10px}.slot-create button{border:0;background:var(--n);color:#fff;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.slot-edit input,.slot-edit select{width:100%;min-width:80px;border:1px solid #cfd9e6;border-radius:8px;padding:8px}.slot-actions{display:flex;gap:6px}.slot-actions button{border:0;border-radius:8px;padding:7px 9px;font-weight:800;cursor:pointer}.edit{background:#eaf3ff;color:#075ea9}.save{background:var(--n);color:#fff}.toggle{background:#eef1f5}.modalbg{position:fixed;inset:0;background:rgba(5,15,29,.55);display:grid;place-items:center;padding:16px;z-index:50}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:19px}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:19px 21px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.modalhead h2{margin:0}.modalbody{padding:20px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cell{background:#f7f9fc;border-radius:11px;padding:11px}.cell.full{grid-column:1/-1}.cell small{display:block;color:var(--muted);margin-bottom:4px}.manage{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.savebar{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;align-items:center}.savebar span{color:var(--ok);font-weight:800}.payment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.paycard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.paycard h3{margin:0 0 5px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.slot-create{grid-template-columns:1fr 1fr}.slot-create button{grid-column:1/-1}.info,.manage,.payment-grid{grid-template-columns:1fr}.cell.full,.field.full,.savebar{grid-column:auto}}@media(max-width:480px){.wrap{padding:0 12px}.stats{grid-template-columns:1fr 1fr}.stat{padding:13px}}</style></head><body><div id="login" class="login"><div class="loginbox"><h1>구원교 컨설팅 관리자</h1><p>관리자 코드를 입력하세요.</p><input id="code" type="password"><button id="loginBtn">관리자 화면 열기</button><div id="loginErr" style="color:#b72d2d;font-weight:800;margin-top:10px"></div></div></div><div id="app" class="hidden"><header class="top"><div class="wrap topin"><b>구원교 컨설팅 ADMIN</b><div><button id="refresh">새로고침</button> <button id="logout">로그아웃</button></div></div></header><main class="main"><div class="wrap"><div class="tabs"><button class="tab on" data-tab="apps">신청관리</button><button class="tab" data-tab="schedule">일정관리</button><button class="tab" data-tab="payments">결제관리</button></div><section id="apps" class="panel on"><div class="stats"><div class="stat"><span>전체 신청</span><strong id="stTotal">0</strong></div><div class="stat"><span>신규 신청</span><strong id="stNew">0</strong></div><div class="stat"><span>승인/결제대기</span><strong id="stWait">0</strong></div><div class="stat"><span>결제완료</span><strong id="stPaid">0</strong></div></div><div class="toolbar"><input id="search" placeholder="이름 · 연락처 · 고민 검색"><select id="statusFilter"><option value="">전체 상태</option><option>신청</option><option>연락완료</option><option>승인완료</option><option>결제완료</option><option>상담확정</option><option>상담완료</option><option>보류</option><option>취소</option></select><select id="catFilter"><option value="">전체 분야</option><option>수험생</option><option>회계사</option><option>강의</option></select><button id="clear">초기화</button></div><div class="box tablewrap"><table><thead><tr><th>신청일</th><th>이름</th><th>연락처</th><th>분야</th><th>상품</th><th>신청상태</th><th>결제상태</th></tr></thead><tbody id="appRows"></tbody></table><div id="appEmpty" class="empty hidden">신청자가 없습니다.</div></div></section><section id="schedule" class="panel"><div class="box"><div class="slot-create"><select id="newType"><option>상담</option><option>LAB</option></select><input id="newDate" type="date"><input id="newStart" type="time"><input id="newEnd" type="time"><input id="newCap" type="number" min="1" value="1" placeholder="정원"><input id="newNote" placeholder="메모/장소"><button id="addSlot">일정 생성</button></div><div class="tablewrap"><table><thead><tr><th>종류</th><th>날짜</th><th>시작</th><th>종료</th><th>정원</th><th>예약</th><th>메모</th><th>공개</th><th>관리</th></tr></thead><tbody id="slotRows"></tbody></table><div id="slotEmpty" class="empty hidden">생성된 일정이 없습니다.</div></div></div></section><section id="payments" class="panel"><div id="payGrid" class="payment-grid"></div><div id="payEmpty" class="empty hidden">결제 관련 신청이 없습니다.</div></section></div></main></div><div id="modalbg" class="modalbg hidden"><div class="modal"><div class="modalhead"><h2 id="modalTitle">신청 상세</h2><button id="close" class="tab">닫기</button></div><div class="modalbody"><div id="detail" class="info"></div><div class="manage"><div class="field"><label>처리 상태</label><select id="editStatus"><option>신청</option><option>연락완료</option><option>승인완료</option><option>결제완료</option><option>상담확정</option><option>상담완료</option><option>보류</option><option>취소</option></select></div><div class="field"><label>결제사</label><select id="provider"><option value="">미지정</option><option>토스페이먼츠</option><option>기타 PG</option><option>직접결제링크</option></select></div><div class="field full"><label>결제 URL</label><input id="payUrl" placeholder="승인 후 고객에게 표시할 결제 링크"></div><div class="field full"><label>관리자 메모</label><textarea id="memo" style="min-height:100px"></textarea></div><div class="savebar"><button id="copyLink" type="button" class="primary" style="margin-right:auto;background:#1976e8">고객 링크 복사</button><span id="saveMsg"></span><button id="saveApp" class="primary">변경사항 저장</button></div></div></div></div></div><script>(()=>{const API='https://ctqvefnqqrskjktrsfbz.supabase.co/functions/v1/consulting-admin-api';let code=sessionStorage.getItem('gw_admin_code')||'',apps=[],slots=[],reservations=[],payments=[],selected=null,editSlot=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const LINK='https://guwongyo-consulting-v2.vercel.app/?status=';const rid=r=>r.application_id||r.app_id||r.consulting_application_id;const slotTxt=s=>s?s.slot_date+' '+String(s.start_time).slice(0,5)+'~'+String(s.end_time).slice(0,5):'';const resv=a=>{const t=reservations.filter(r=>rid(r)===a.id&&r.status==='예약').map(r=>slotTxt(slots.find(s=>s.id===r.slot_id)));return t.length?t.join('\n'):'-'};const rsv=id=>{const rs=reservations.filter(r=>r.slot_id===id&&r.status==='예약');return rs.length+(rs.length?' · '+rs.map(r=>(apps.find(a=>a.id===rid(r))||{}).name||'?').join(', '):'')};const fmt=d=>{try{return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(d))}catch{return d||''}};async function api(method='GET',body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-admin-code':code},body:body?JSON.stringify(body):undefined});if(r.status===401)throw new Error('unauthorized');const j=await r.json();if(!r.ok)throw new Error(j.error||'request_failed');return j}async function login(){code=$('code').value.trim();$('loginErr').textContent='';try{await api();sessionStorage.setItem('gw_admin_code',code);enter()}catch{$('loginErr').textContent='관리자 코드가 올바르지 않습니다.'}}function enter(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}async function load(){try{const j=await api();apps=j.applications||[];slots=j.slots||[];reservations=j.reservations||[];payments=j.payments||[];renderAll()}catch(e){if(e.message==='unauthorized'){sessionStorage.clear();location.reload()}else alert('불러오기 실패: '+e.message)}}function renderAll(){renderStats();renderApps();renderSlots();renderPayments()}function renderStats(){$('stTotal').textContent=apps.length;$('stNew').textContent=apps.filter(x=>x.status==='신청').length;document.title=($('stNew').textContent>0?'('+$('stNew').textContent+') ':'')+'구원교 컨설팅 관리자';$('stWait').textContent=apps.filter(x=>x.payment_status==='결제대기').length;$('stPaid').textContent=apps.filter(x=>x.payment_status==='결제완료').length}function filtered(){const q=$('search').value.trim().toLowerCase(),s=$('statusFilter').value,c=$('catFilter').value;return apps.filter(x=>(!s||x.status===s)&&(!c||x.category===c)&&(!q||[x.name,x.phone,x.email,x.biggest_concern,x.current_status,x.subcategory].join(' ').toLowerCase().includes(q)))}function renderApps(){const list=filtered();$('appRows').innerHTML='';$('appEmpty').classList.toggle('hidden',list.length>0);list.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+esc(fmt(x.created_at))+'</td><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.phone)+'</td><td>'+esc(x.subcategory)+'</td><td>'+(x.lab_interest==='LAB 추가'?'<span class="badge gold">컨설팅+LAB 50만</span>':'컨설팅 30만')+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td><span class="badge '+(x.payment_status==='결제완료'?'green':x.payment_status==='취소'?'red':'')+'">'+esc(x.payment_status||'미결제')+'</span></td>';tr.onclick=()=>openApp(x.id);$('appRows').appendChild(tr)})}function block(l,v,full=false){return '<div class="cell'+(full?' full':'')+'"><small>'+l+'</small><div style="white-space:pre-wrap;word-break:break-word">'+esc(v||'-')+'</div></div>'}function openApp(id){selected=apps.find(x=>x.id===id);if(!selected)return;$('modalTitle').textContent=selected.name+' · '+selected.subcategory;$('detail').innerHTML=block('신청일',fmt(selected.created_at))+block('연락처',selected.phone)+block('이메일',selected.email)+block('상품',selected.lab_interest)+block('현재 상황',selected.current_status,true)+block('가장 큰 고민',selected.biggest_concern,true)+block('질문',(selected.questions||[]).map((q,i)=>(i+1)+'. '+q).join('\n'),true)+block('결제 상태',selected.payment_status)+block('예약 일정',resv(selected));$('editStatus').value=selected.status||'신청';$('provider').value=selected.payment_provider||'';$('payUrl').value=selected.payment_url||'';$('memo').value=selected.admin_memo||'';$('saveMsg').textContent='';$('modalbg').classList.remove('hidden')}async function saveApp(){if(!selected)return;const u=$('payUrl').value.trim();$('payUrl').value=u;if(u&&!/^https:\/\//.test(u)){$('saveMsg').textContent='결제 URL은 https://로 시작해야 해요';return}$('saveApp').disabled=true;$('saveMsg').textContent='저장 중...';try{const j=await api('POST',{action:'updateApplication',id:selected.id,status:$('editStatus').value,payment_provider:$('provider').value,payment_url:$('payUrl').value,admin_memo:$('memo').value});const i=apps.findIndex(x=>x.id===selected.id);apps[i]=j.application;selected=j.application;$('saveMsg').textContent='저장 완료';renderAll()}catch(e){$('saveMsg').textContent='저장 실패'}finally{$('saveApp').disabled=false}}function countReserved(slotId){return reservations.filter(r=>r.slot_id===slotId&&r.status==='예약').length}function renderSlots(){$('slotRows').innerHTML='';$('slotEmpty').classList.toggle('hidden',slots.length>0);slots.forEach(s=>{const tr=document.createElement('tr'),isEdit=editSlot===s.id;if(isEdit){tr.className='slot-edit';tr.innerHTML='<td><select data-k="slot_type"><option '+(s.slot_type==='상담'?'selected':'')+'>상담</option><option '+(s.slot_type==='LAB'?'selected':'')+'>LAB</option></select></td><td><input data-k="slot_date" type="date" value="'+s.slot_date+'"></td><td><input data-k="start_time" type="time" value="'+String(s.start_time).slice(0,5)+'"></td><td><input data-k="end_time" type="time" value="'+String(s.end_time).slice(0,5)+'"></td><td><input data-k="capacity" type="number" min="1" value="'+s.capacity+'"></td><td>'+countReserved(s.id)+'</td><td><input data-k="note" value="'+esc(s.note||'')+'"></td><td><input data-k="active" type="checkbox" '+(s.active?'checked':'')+'></td><td><div class="slot-actions"><button class="save">저장</button><button class="toggle">취소</button></div></td>';tr.querySelector('.save').onclick=async e=>{e.stopPropagation();const get=k=>tr.querySelector('[data-k='+k+']');try{const j=await api('POST',{action:'updateSlot',id:s.id,slot_type:get('slot_type').value,slot_date:get('slot_date').value,start_time:get('start_time').value,end_time:get('end_time').value,capacity:Number(get('capacity').value),note:get('note').value,active:get('active').checked});slots[slots.findIndex(x=>x.id===s.id)]=j.slot;editSlot=null;renderSlots()}catch(e){alert('일정 수정 실패: '+e.message)}};tr.querySelector('.toggle').onclick=e=>{e.stopPropagation();editSlot=null;renderSlots()}}else{tr.innerHTML='<td><span class="badge '+(s.slot_type==='LAB'?'gold':'')+'">'+s.slot_type+'</span></td><td><b>'+s.slot_date+'</b></td><td>'+String(s.start_time).slice(0,5)+'</td><td>'+String(s.end_time).slice(0,5)+'</td><td>'+s.capacity+'</td><td>'+esc(rsv(s.id))+'</td><td>'+esc(s.note||'-')+'</td><td>'+(s.active?'<span class="badge green">공개</span>':'<span class="badge red">비공개</span>')+'</td><td><div class="slot-actions"><button class="edit">수정</button><button class="toggle">'+(s.active?'비공개':'공개')+'</button></div></td>';tr.querySelector('.edit').onclick=e=>{e.stopPropagation();editSlot=s.id;renderSlots()};tr.querySelector('.toggle').onclick=async e=>{e.stopPropagation();const j=await api('POST',{action:'updateSlot',id:s.id,active:!s.active});slots[slots.findIndex(x=>x.id===s.id)]=j.slot;renderSlots()}}$('slotRows').appendChild(tr)})}async function addSlot(){const body={action:'createSlot',slot_type:$('newType').value,slot_date:$('newDate').value,start_time:$('newStart').value,end_time:$('newEnd').value,capacity:Number($('newCap').value||1),note:$('newNote').value};if(!body.slot_date||!body.start_time||!body.end_time){alert('날짜와 시작/종료 시간을 입력해주세요.');return}try{const j=await api('POST',body);slots.push(j.slot);slots.sort((a,b)=>(a.slot_date+a.start_time).localeCompare(b.slot_date+b.start_time));$('newNote').value='';renderSlots()}catch(e){alert('일정 생성 실패: '+e.message)}}function renderPayments(){const list=apps.filter(x=>x.payment_status&&x.payment_status!=='미결제');$('payGrid').innerHTML='';$('payEmpty').classList.toggle('hidden',list.length>0);list.forEach(x=>{const d=document.createElement('div');d.className='paycard';d.innerHTML='<h3>'+esc(x.name)+'</h3><div>'+esc(x.subcategory)+'</div><p><b>'+(x.lab_interest==='LAB 추가'?'500,000원':'300,000원')+'</b></p><div>상태: <span class="badge '+(x.payment_status==='결제완료'?'green':'')+'">'+esc(x.payment_status)+'</span></div><div style="margin-top:6px">결제사: '+esc(x.payment_provider||'-')+'</div>';d.onclick=()=>openApp(x.id);$('payGrid').appendChild(d)})}document.querySelectorAll('.tab[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===b.dataset.tab))});$('loginBtn').onclick=login;$('code').onkeydown=e=>{if(e.key==='Enter')login()};$('refresh').onclick=load;$('logout').onclick=()=>{sessionStorage.removeItem('gw_admin_code');location.reload()};$('search').oninput=renderApps;$('statusFilter').onchange=renderApps;$('catFilter').onchange=renderApps;$('clear').onclick=()=>{$('search').value='';$('statusFilter').value='';$('catFilter').value='';renderApps()};$('close').onclick=()=>$('modalbg').classList.add('hidden');$('modalbg').onclick=e=>{if(e.target===$('modalbg'))$('modalbg').classList.add('hidden')};$('saveApp').onclick=saveApp;$('copyLink').onclick=()=>{if(selected&&selected.customer_status_token)navigator.clipboard.writeText(LINK+selected.customer_status_token).then(()=>{$('saveMsg').textContent='링크 복사됨'})};setInterval(()=>{if(code&&!document.hidden&&!editSlot&&$('modalbg').classList.contains('hidden')&&!$('app').classList.contains('hidden'))load()},60000);$('addSlot').onclick=addSlot;if(code)api().then(enter).catch(()=>{sessionStorage.removeItem('gw_admin_code');code=''})})();</script></body></html>
